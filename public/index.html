<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Task Board</h1>
    <p class="sub"><span id="remaining">0</span> tasks left</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="200" autocomplete="off" required />
      <button type="submit">Add task</button>
    </form>

    <p id="error" role="alert"></p>
    <ul id="task-list"></ul>
    <p id="empty" hidden>No tasks yet. Add your first one above.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
